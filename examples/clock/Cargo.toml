[package]
name = "mdrv-ds-clock"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Clock example for the mdrv-ds shell: overlay-footer formatting as a standalone screensaver-style clock"
publish = false # depends on the gpui fork (not on crates.io)

[[bin]]
name = "clock"
path = "src/main.rs"

[dependencies]
# Policy-B (git-tag) form so CI/release runners can build without the
# /g/gpui-ce checkout; local path form is the dev convention (swap back
# when iterating on the fork).
gpui = { package = "mdrv-gpui-ce", git = "https://github.com/mdrv/gpui-ce", tag = "mdrv-gpui-0.0.260925" }
gpui_platform = { package = "mdrv-gpui-platform", git = "https://github.com/mdrv/gpui-ce", tag = "mdrv-gpui-0.0.260925", features = ["wayland", "x11"] }
mdrv-ds-shell = { path = "../../crates/shell" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
